<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>砂布成本计算系统</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <h1>
        砂布成本及报价计算系统
    </h1>



    <a href="admin.html" id="adminLink" class="nav-button" hidden>
        进入管理员后台
    </a>

    <a href="change-password.html" class="nav-button">
        修改密码
    </a>

    <button type="button" class="nav-button" onclick="logoutSystem()">
        退出登录
    </button>




    <div class="main">



        <!-- 左侧输入 -->

        <div class="input-area">


            <h2>
                输入参数
            </h2>




            <h3>
                产品规格
            </h3>



            <label>
                规格:

                <select id="specSelect">

                    <option value="">
                        请选择规格
                    </option>

                </select>

            </label>




            <label>
                条宽:

                <input
                        id="width"
                        type="number"
                        min="0">

            </label>




            <label>
                页长:

                <input
                        id="length"
                        type="number"
                        min="0">

            </label>




            <label>
                页数:

                <input
                        id="layers"
                        type="number"
                        min="0">

            </label>







            <h3>
                材料成本
            </h3>




            <h4>
                砂布选择
            </h4>




            <label>

                磨料:

                <select id="abrasiveSelect">

                    <option value="">
                        请选择磨料
                    </option>

                </select>

            </label>





            <label>

                编号:

                <select id="materialSelect">

                    <option value="">
                        请选择编号
                    </option>

                </select>

            </label>





            <label>

                粒度:

                <select id="gritSelect">

                    <option value="">
                        请选择粒度
                    </option>

                </select>

            </label>






            <label>

                砂布价:

                <input

                        id="gauzePrice"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                        placeholder="自动获取或手动输入"

                >

            </label>





            <label>

                基体成本:

                <input

                        id="baseCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>





            <label>

                胶水成本:

                <input

                        id="glueCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>





            <label>

                标贴成本:

                <input

                        id="labelCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>





            <label>

                纸箱成本:

                <input

                        id="cartonCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>







            <h3>
                其他成本
            </h3>





            <label>

                人工成本:

                <input

                        id="laborCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>





            <label>

                管理及杂开支:

                <input

                        id="managementCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>





            <label>

                运费（到港）:

                <input

                        id="shippingCost"

                        type="number"

                        step="0.01"

                        min="0"

                        value="0"

                >

            </label>







            <h3>
                利润率
            </h3>





            <label>

                中间商:

                <input

                        id="profitRate1"

                        type="number"

                        value="10"

                        min="0"

                        max="200"

                >

                %

            </label>






            <label>

                参考:

                <input

                        id="profitRate2"

                        type="number"

                        value="20"

                        min="0"

                        max="200"

                >

                %

            </label>






            <label>

                终端用户:

                <input

                        id="profitRate3"

                        type="number"

                        value="30"

                        min="0"

                        max="200"

                >

                %

            </label>







            <button onclick="calculate()">

                开始计算

            </button>





        </div>










        <!-- 右侧结果 -->

        <div class="result-area">





            <h2>
                计算结果
            </h2>


            <div class="save-area" id="quotationSaveArea" hidden>

                <label>
                    报价备注：
                    <input
                            id="quotationRemark"
                            type="text"
                            placeholder="例如：客户A 7月报价"
                    >
                </label>


                <button onclick="saveQuotation()">
                    保存报价
                </button>

            </div>


            <p>

                所用砂布量：

                <span id="gauzeQuantity">
                    -
                </span>

            </p>





            <p>

                砂布成本：

                <span id="gauzeCost">
                    -
                </span>

            </p>





            <p>

                材料总成本（含税）：

                <span id="materialTax">
                    -
                </span>

            </p>





            <p>

                材料总成本（不含税）：

                <span id="materialNoTax">
                    -
                </span>

            </p>





            <p>

                其他成本：

                <span id="otherCost">
                    -
                </span>

            </p>





            <p>

                含税含运总成本：

                <span id="totalCost">
                    -
                </span>

            </p>







            <h2>
                报价结果
            </h2>






            <table>


                <thead>


                <tr>

                    <th>方案</th>

                    <th>利润率</th>

                    <th>利润</th>

                    <th>售价</th>

                    <th>不开票</th>

                </tr>


                </thead>





                <tbody>



                <tr>

                    <td>
                        中间商
                    </td>

                    <td id="rate1">
                        -
                    </td>

                    <td id="profit1">
                        -
                    </td>

                    <td id="price1">
                        -
                    </td>

                    <td id="noInvoice1">
                        -
                    </td>


                </tr>






                <tr>

                    <td>
                        参考
                    </td>

                    <td id="rate2">
                        -
                    </td>

                    <td id="profit2">
                        -
                    </td>

                    <td id="price2">
                        -
                    </td>

                    <td id="noInvoice2">
                        -
                    </td>


                </tr>







                <tr>

                    <td>
                        终端用户
                    </td>

                    <td id="rate3">
                        -
                    </td>

                    <td id="profit3">
                        -
                    </td>

                    <td id="price3">
                        -
                    </td>

                    <td id="noInvoice3">
                        -
                    </td>


                </tr>





                </tbody>



            </table>






        </div>





    </div>





</div>





<script src="app.js"></script>


</body>


</html>
