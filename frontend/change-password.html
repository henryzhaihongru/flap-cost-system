<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
    <form id="changePasswordForm" class="login-card">
        <h1>修改密码</h1>
        <label>当前密码
            <input id="currentPassword" type="password" autocomplete="current-password" required>
        </label>
        <label>新密码
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>再次输入新密码
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="password-hint">新密码至少8位，不能与当前密码相同。</p>
        <div id="changeMessage" class="login-message" aria-live="polite"></div>
        <button type="submit">确认修改</button>
        <a href="index.html" class="login-back">返回成本计算</a>
    </form>
</div>
<script src="change-password.js"></script>
</body>
</html>
